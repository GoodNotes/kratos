version: "2"

linters:
  enable:
    - gosec
    - govet
    - errcheck
    - ineffassign
    - staticcheck
    - unused
  disable:
    - bodyclose # too many false negatives
  settings:
    gosec:
      excludes:
        - G101
        - G117
        - G306
        - G704
        - G705
        - G710
        - G115
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF*
  exclusions:
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy
    paths:
      - sdk/
      - ".+_test\\.go"
      - "corpx/faker.go"
    rules:
      - linters:
          - staticcheck
        text: "SA1019" # we do use deprecated APIs on purpose sometimes

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ory
